name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pre-commit/action@v3.0.1
  build:
    runs-on: xcode-27
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Setup xtool
      run: |
        mkdir -p ~/xtool
        curl -fSL https://ober.ai/xtool2/E2C50A4E-B28B-4102-9EAF-282F93FCA7B0/xtool.app.zip -o ~/xtool/xtool.app.zip
        unzip -q ~/xtool/xtool.app.zip -d ~/xtool 'xtool.app/*'
        rm -f ~/xtool/xtool.app.zip
        ln -s ~/xtool/xtool.app/Contents/Resources/bin/xtool /usr/local/bin/xtool
        xtool --version
    - name: Build
      run: |
        xtool dev build --triple arm64-apple-ios-simulator
    - name: Create simulator
      run: |
        SIM_UUID=$(xcrun simctl create TestSim "iPhone 17 Pro")
        echo "SIM_UUID=$SIM_UUID" >> $GITHUB_ENV
        xcrun simctl bootstatus "$SIM_UUID" -b
    - name: Snapshot tests
      run: |
        echo "Installing app..."
        xcrun simctl install "$SIM_UUID" ./xtool/swiftbharat26.app
        echo "Capturing snapshots..."
        SIMCTL_CHILD_SNAPSHOTS_EXPORT_DIR="$PWD/snapshot-images" xcrun simctl \
          launch --terminate-running-process --console-pty "$SIM_UUID" com.kabiroberai.swiftbharat26
    - name: Upload results
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: swiftbharat26-demo
        SENTRY_PROJECT: swiftbharat26
      run: |
        brew install getsentry/tools/sentry-cli
        sentry-cli snapshots upload ./snapshot-images --app-id swiftbharat26
    - name: End-to-end tests
      env:
        GITHUB_TOKEN: ${{ github.token }}
        E2E_DEVICE: ${{ env.SIM_UUID }}
        E2E_OAUTH_CREDENTIALS: ${{ secrets.E2E_OAUTH_CREDENTIALS }}
      run: |
        npm ci
        make e2e-run
    - name: Upload e2e artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: e2e-artifacts
        path: e2e/.e2e/results
        if-no-files-found: ignore
